name: Construire l'APK CAM93

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'application Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compiler l'APK Debug
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: CAM93-Mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
