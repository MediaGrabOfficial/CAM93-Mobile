name: Construire l'APK CAM93

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'application Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Préparer le SDK Android
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | grep -E '/[0-9]+(\\.[0-9]+)*/bin/sdkmanager$' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager introuvable dans $SDK_ROOT" >&2; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Compiler l'APK Debug
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: CAM93-Mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
